spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/blogapp
    username: ally
    password: ''
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
  flyway:
    baseline-on-migrate: true
  graphql:
    graphiql:
      enabled: true

logging:
  level:
    com.ally.blogapp: DEBUG
    org.hibernate.SQL: DEBUG
