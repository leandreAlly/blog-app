spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  graphql:
    graphiql:
      enabled: false

logging:
  level:
    com.ally.blogapp: WARN
    root: ERROR

server:
  port: ${PORT:8080}
